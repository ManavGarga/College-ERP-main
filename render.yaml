services:
  - type: web
    name: college-erp
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn college_management_system.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: college-erp.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.0
